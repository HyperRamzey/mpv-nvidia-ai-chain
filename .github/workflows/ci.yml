# ============================================================================
# ci.yml — fast checks on every push/PR. No package build; that is release.yml.
# The release workflow re-runs all of this as its `validate` job, so a green
# CI run here means the release gates will pass too.
# ============================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPV_COMMIT: fe753a78246151a2489b472dabcb04f2edd61d50

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Patch sha256 matches PKGBUILD
        run: |
          set -euo pipefail
          sha="$(sha256sum vfx-filters.patch | cut -d' ' -f1)"
          grep -q "$sha" PKGBUILD \
            || { echo "::error::PKGBUILD does not pin the current patch sha256"; exit 1; }
          echo "patch sha256: $sha"

      - name: Patch applies to the pinned mpv commit
        run: |
          set -euo pipefail
          git init -q /tmp/mpv
          cd /tmp/mpv
          git remote add origin https://github.com/mpv-player/mpv.git
          git fetch -q --depth=1 origin "$MPV_COMMIT"
          git checkout -q FETCH_HEAD
          patch -Np1 --dry-run -i "$GITHUB_WORKSPACE/vfx-filters.patch"

      # The Chromium extension and its native messaging host moved to
      # https://github.com/HyperRamzey/mpv-ai-extension, and the shellcheck and
      # JSON-manifest gates that covered them went with the files. lua5.1 is
      # installed here because the regression step below needs it.
      - name: Python helpers compile
        run: |
          set -euo pipefail
          python3 -m py_compile find-deps.py tools/*.py

      - name: Filter and refresh-rate regressions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          luac5.1 -p scripts/vfg-sync.lua
          lua5.1 tests/vfg-sync-refresh.lua

      - name: ai.conf is a valid mpv config
        run: |
          set -euo pipefail
          awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /^[[:space:]]*\[.*\][[:space:]]*$/ && $0 !~ /=/ {print; bad=1} END{exit bad}' ai.conf
