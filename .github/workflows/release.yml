# ============================================================================
# release.yml — build the Arch package and publish a GitHub release.
#
# Local equivalent:
#   cd ~/ai-video/build/arch
#   BUILDDIR=~/ai-video/build/makepkg makepkg -f -e --noprepare --check
#   sudo pacman -U mpv-dovi-vfx-git-*.pkg.tar.zst
#
# CI does a *cold* build from scratch in an Arch container:
#   validate -> patch hash + patch dry-run against the pinned mpv commit
#   build    -> pacman deps (incl. cuda/nvidia-utils) + makepkg --check
#   release  -> attach package + patch + config + SHA256SUMS
#
# Triggers:
#   * push a v* tag            -> release named after the tag
#   * workflow_dispatch        -> release named v<pkgver>-<pkgrel>-<UTC>
#
# The build does not need a GPU: nvidia-utils only provides libcuda.so to link
# against, and cuda provides cuda.h/nvrtc.h/libnvrtc.so.13. Nothing executes
# CUDA at build time; `makepkg --check` runs mpv's own unit tests.
# ============================================================================

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned upstream commit the patch was written against (also in PKGBUILD).
  MPV_COMMIT: 7f505de186ddcaeff6dabf48db79c9b8f8adc309

jobs:
  # --------------------------------------------------------------------------
  # validate: cheap integrity gates. Fails before a 40-minute build if the
  # patch does not apply cleanly or PKGBUILD does not pin this exact patch.
  # --------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Patch sha256 matches PKGBUILD
        run: |
          set -euo pipefail
          sha="$(sha256sum vfx-filters.patch | cut -d' ' -f1)"
          echo "patch sha256: $sha"
          grep -q "$sha" PKGBUILD \
            || { echo "::error::PKGBUILD does not pin the current patch sha256"; exit 1; }

      # A stale pin in sha256sums only surfaces after makepkg has downloaded
      # and cloned everything, i.e. minutes into the release build.
      - name: Local sources match their sha256sums pins
        run: python3 tools/check_pkgbuild_sums.py

      - name: Patch applies to the pinned mpv commit
        run: |
          set -euo pipefail
          git init -q /tmp/mpv
          cd /tmp/mpv
          git remote add origin https://github.com/mpv-player/mpv.git
          git fetch -q --depth=1 origin "$MPV_COMMIT"
          git checkout -q FETCH_HEAD
          patch -Np1 --dry-run -i "$GITHUB_WORKSPACE/vfx-filters.patch"
          echo "Patch applies cleanly to $(git rev-parse --short HEAD)"

      # Mirrors ci.yml exactly. The extension and the native messaging host (and
      # the shellcheck gate that covered them) live in
      # https://github.com/HyperRamzey/mpv-ai-extension now.
      - name: Python helpers compile
        run: |
          set -euo pipefail
          python3 -m py_compile find-deps.py tools/*.py

      - name: Filter and refresh-rate regressions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          luac5.1 -p scripts/vfg-sync.lua
          lua5.1 tests/vfg-sync-refresh.lua
          luac5.1 -p scripts/beam-sim.lua
          lua5.1 tests/beam-sim.lua
          luac5.1 -p scripts/nr-toggle.lua

      - name: Beam shader headers are well formed
        run: |
          set -euo pipefail
          shader=shaders/crt-beam-sim.glsl
          known='//!(HOOK|BIND|PARAM|DESC|TYPE|MINIMUM|MAXIMUM)([[:space:]]|$)'
          stray="$(grep -n '//!' "$shader" | grep -vE "$known" || true)"
          if [ -n "$stray" ]; then
            echo "$stray"
            echo "::error::header marker on a non-header line"
            exit 1
          fi
          first_hook="$(grep -n '//!HOOK' "$shader" | head -1 | cut -d: -f1)"
          last_param="$(grep -n '//!PARAM' "$shader" | tail -1 | cut -d: -f1)"
          if [ -n "$last_param" ] && [ "$last_param" -gt "$first_hook" ]; then
            echo "::error::PARAM block after HOOK is rejected by libplacebo"
            exit 1
          fi
          for name in subframes gain_vs_blur gamma scan_direction \
                      raster_mod anti_retention slew transfer peak_nits \
                      beam_headroom chroma_balance; do
            grep -q "^//!PARAM $name$" "$shader" \
              || { echo "::error::missing PARAM $name"; exit 1; }
          done
          echo "beam shader headers ok"

      - name: ai.conf is a valid mpv config
        run: |
          set -euo pipefail
          # Every non-comment line must be key=value; catches a broken profile
          # before it reaches a release.
          awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /^[[:space:]]*\[.*\][[:space:]]*$/ && $0 !~ /=/ {print; bad=1} END{exit bad}' ai.conf
          echo "ai.conf: $(grep -c '^\[' ai.conf) sections"

      - name: Packaging inputs are present and valid
        run: |
          set -euo pipefail
          bash -n packaging/deb/build-deb.sh
          bash -n packaging/mpv-ai
          test -x packaging/deb/build-deb.sh
          test -x packaging/mpv-ai
          for f in ai.conf input.conf README.md LICENSE.md docs/CRT-BEAM.md \
                   scripts/vfg-sync.lua scripts/nr-toggle.lua \
                   scripts/beam-sim.lua shaders/crt-beam-sim.glsl; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo 'packaging inputs ok'

  # --------------------------------------------------------------------------
  # build: cold makepkg in an Arch container.
  # --------------------------------------------------------------------------
  build:
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Prepare container
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git sudo ccache
          sed -i 's/!ccache/ccache/' /etc/makepkg.conf
          grep -Eq 'BUILDENV=.*\bccache\b' /etc/makepkg.conf
          df -h / | tail -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ env.MPV_COMMIT }}-${{ hashFiles('vfx-filters.patch', 'PKGBUILD') }}
          restore-keys: |
            ccache-${{ env.MPV_COMMIT }}-

      - name: Create builder
        run: |
          set -euo pipefail
          # After the cache restore: the restored directory is owned by root,
          # and ccache has to be able to write into it as the builder user.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p .ccache
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "CCACHE_DIR='$GITHUB_WORKSPACE/.ccache' ccache -M 1G"

      - name: Install makedepends
        run: |
          set -euo pipefail
          # Source the PKGBUILD only for its arrays; nothing executes.
          source ./PKGBUILD
          pacman -S --noconfirm --needed "${makedepends[@]}" nvidia-utils
          # makedepends covers what FFmpeg and the filters need, not every
          # library mpv's meson probes for. The distro mpv package pulls
          # exactly the set the official build is configured against
          # (libxkbcommon, libxpresent, libsixel, libdisplay-info, ...), which
          # is cheaper and more complete than chasing meson's requirements one
          # failed cold build at a time. It does not change what gets linked:
          # build() puts its own prefix ahead of the system pkg-config path, and
          # check() asserts the result has no dynamic libav*/libplacebo.
          pacman -S --noconfirm --needed mpv
          # The package download cache doubles the disk footprint at the worst
          # moment (cuda alone is 2.4 GiB compressed / 5.2 GiB installed).
          pacman -Scc --noconfirm

      - name: Build package
        run: |
          set -euo pipefail
          su builder -c "cd '$GITHUB_WORKSPACE' && \
            CCACHE_DIR='$GITHUB_WORKSPACE/.ccache' \
            makepkg -f --nodeps --check --noconfirm"

      - name: Collect assets
        run: |
          set -euo pipefail
          source ./PKGBUILD
          ver="${pkgver}-${pkgrel}"
          mkdir -p dist
          cp mpv-dovi-vfx-git-*.pkg.tar.zst dist/
          cp vfx-filters.patch PKGBUILD mpv.install find-deps.py ai.conf \
             input.conf dist/
          # Flat on purpose: `gh release create` uploads each file by its
          # basename, so dist/scripts/x.lua lands as x.lua. Keeping the
          # subdirectories here made SHA256SUMS list ./scripts/x.lua, which
          # no asset is named -- `sha256sum -c` then failed on four files.
          cp scripts/vfg-sync.lua scripts/nr-toggle.lua \
             scripts/beam-sim.lua dist/
          cp shaders/crt-beam-sim.glsl dist/
          cat > dist/RELEASE_NOTES.md <<EOF
          ## mpv-dovi-vfx-git ${ver}

          Built from $(printf '%s' "$GITHUB_SHA" | cut -c1-7) in CI: the Arch
          package in \`archlinux:base-devel\` (CUDA 13.4) and the Debian package
          natively on Ubuntu 24.04 (CUDA 12.0 headers, system libnvrtc 12).

          | Component | Pin |
          | --- | --- |
          | mpv | \`${_mpvcommit}\` |
          | libplacebo | \`${_lpcommit}\` (static, libdovi) |
          | FFmpeg | ${_ffmpegver}, static |
          | VFX patch | \`$(sha256sum vfx-filters.patch | cut -d' ' -f1)\` |

          ### Install

          \`\`\`sh
          sudo pacman -U mpv-dovi-vfx-git-*.pkg.tar.zst
          install -Dm644 ai.conf                   ~/.config/mpv/ai.conf
          install -Dm644 input.conf                ~/.config/mpv/input.conf
          install -Dm644 vfg-sync.lua      ~/.config/mpv/scripts/vfg-sync.lua
          install -Dm644 nr-toggle.lua     ~/.config/mpv/scripts/nr-toggle.lua
          install -Dm644 beam-sim.lua      ~/.config/mpv/scripts/beam-sim.lua
          install -Dm644 crt-beam-sim.glsl \
            ~/.config/mpv/shaders/crt-beam-sim.glsl
          \`\`\`

          Every asset is a flat file: the release upload uses basenames, so
          \`scripts/vfg-sync.lua\` in the repository arrives as \`vfg-sync.lua\`
          and \`shaders/crt-beam-sim.glsl\` as \`crt-beam-sim.glsl\`.

          ### Install - Debian / Ubuntu 24.04

          \`\`\`sh
          sudo apt install ./mpv-dovi-vfx_${pkgver//_/.}-${pkgrel}_amd64.deb
          mpv-ai movie.mkv
          \`\`\`

          The .deb is turnkey: it installs the player, \`/etc/mpv/ai.conf\`,
          \`/etc/mpv/input.conf\`, the Lua controllers, the beam shader and the
          \`mpv-ai\` wrapper, so no per-user copying is needed. It replaces the
          distribution \`mpv\` and \`libmpv2\` packages, which own the same files.
          An NVIDIA driver providing \`libcuda.so.1\` is required and
          \`libnvrtc12\` is pulled in automatically. The optional NVIDIA VFX SDK
          libraries are still loaded from \`\$HOME/.local/lib/vsr-player\` at
          runtime.

          The Debian build uses Ubuntu's CUDA 12.0 toolkit. On Blackwell
          (RTX 50xx) the NVRTC kernels need CUDA 12.8 or newer at runtime;
          install NVIDIA's \`cuda-nvrtc-12-8\` if the filters report a JIT
          failure.

          Noise reduction is off by default (\`dlssnr:passes=0\` is a true
          passthrough); frame generation follows the display refresh through
          \`scripts/vfg-sync.lua\`.

          ### CRT beam simulator

          \`scripts/beam-sim.lua\` and \`shaders/crt-beam-sim.glsl\` render a
          phosphor beam at the end of the filter chain. k = display_hz /
          sweep_hz: at or below 0.8x the refresh k is an integer (240->3,
          165->2, 120->2); above it k is fractional so VFG can emit
          display/k exactly. At 165 Hz with x6 frame generation that is
          143.856 fps and k = 1.147 - one sweep every ~0.87 refresh, a narrow
          dark arc crawling backwards instead of a 30 Hz band. Disabling the
          beam restores every property it touched.

          Brightness is conserved (Talbot-Plateau): the beam splits each pixel's
          light into an intensity and an emission window so the sweep average
          equals the source, which is what an HDR chain requires. Sharpness
          comes from \`beam_headroom\` (flash above the tone-mapped peak)
          instead of from dimming, and \`chroma_balance\` keeps one emission
          window per pixel so colours do not fringe in motion.

          | Key | Message | Effect |
          | --- | --- | --- |
          | \`Ctrl+Alt+b\` | \`beam toggle\` | enable or disable |
          | \`Ctrl+Alt+v\` | \`beam status\` | MPRT, subframes, VFG |
          | \`Alt+Shift+b\` | \`beam subframes <n>\` | pin subframes |
          | \`Ctrl+Alt+g\` | \`beam gain <f>\` | clarity vs brightness |
          | \`Ctrl+Alt+y\` | \`beam direction <n>\` | raster direction |
          | — | \`beam sweep <hz>\` | target sweep, rebuilds k |
          | — | \`beam k <n>\` | pin k directly (fractional allowed) |

          \`docs/CRT-BEAM.md\` in the repository has the physics, the shader
          parameters and the refresh-rate rules.

          The package pins the exact mpv commit, the patch, and static
          libplacebo + FFmpeg; nothing in the system is replaced. The VFX SDK
          libraries are \`dlopen\`ed at runtime and are not part of this
          package; without them mpv still plays normally.

          ### Verify

          \`\`\`sh
          sha256sum -c SHA256SUMS
          mpv --version | head -1
          \`\`\`
          EOF
          ( cd dist && find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS )
          ls -lh dist
          df -h / | tail -1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # build-deb: the same pins, built natively on Ubuntu 24.04 and packaged as a
  # .deb. PKGBUILD's prepare()/build()/check() are reused by
  # packaging/deb/build-deb.sh, so both packages carry the same libplacebo,
  # FFmpeg, patch and VFX filters. No GPU is needed: the CUDA driver stub is
  # linked against, never executed.
  # --------------------------------------------------------------------------
  build-deb:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Enable multiverse
        run: |
          set -euo pipefail
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # The explicitly-enabled options of the pinned mpv/libplacebo/FFmpeg
          # configs need the first block; the rest keeps meson's auto-detected
          # features identical to the Arch build instead of silently dropping
          # outputs on a bare runner.
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config git curl ca-certificates \
            python3-jinja2 python3-markupsafe \
            libvulkan-dev libshaderc-dev liblcms2-dev libunwind-dev \
            libdav1d-dev libvpx-dev libssl-dev libxml2-dev \
            libluajit-5.1-dev libdvbv5-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libva-dev \
            libass-dev libdrm-dev libxinerama-dev libxss-dev libxv-dev \
            libxpresent-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libfontconfig-dev libarchive-dev libbluray-dev libdvdnav-dev \
            libdvdread-dev libcdio-paranoia-dev libcdio-cdda-dev \
            librubberband-dev libzimg-dev libpulse-dev libpipewire-0.3-dev \
            libjack-dev libasound2-dev libsndio-dev libuchardet-dev \
            libsixel-dev libcaca-dev libvdpau-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxfixes-dev libxrender-dev libxcb1-dev \
            libxcb-shm0-dev libxcb-xv0-dev zlib1g-dev libbz2-dev liblzma-dev \
            libzstd-dev nvidia-cuda-toolkit
          df -h / | tail -1

      - name: Restore cargo-c
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-ctest
          key: cargo-c-0.10.28-rust-stable

      - name: Install Rust and cargo-c
        run: |
          set -euo pipefail
          # libdovi 3.4.0 needs rustc >= 1.88 (noble ships 1.75). stable is
          # used rather than the exact floor: cargo resolves dependency
          # versions at build time and the newest ones may require more.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          if ! command -v cargo-cinstall >/dev/null 2>&1; then
            # Noble's cargo-c 0.9.19 embeds cargo 0.82, whose manifest parser
            # predates edition 2024 and rejects libdovi 3.4.0 outright:
            #   failed to parse the `edition` key ... only supports 2015/2018/2021
            # Build a current cargo-c with the rustup toolchain instead.
            cargo install cargo-c --version 0.10.28
          fi
          cargo-cinstall --version

      - name: Build .deb
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          packaging/deb/build-deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist-deb/
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # release: publish. Tag pushes use the tag; manual runs get a dated tag.
  # --------------------------------------------------------------------------
  release:
    needs: [validate, build, build-deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Regenerate SHA256SUMS over both packages
        run: |
          set -euo pipefail
          # The Arch job writes a SHA256SUMS for its own artifact; the release
          # must cover the .deb too, so it is rebuilt here over the merge.
          cd dist
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            source ./PKGBUILD
            tag="v${pkgver}-${pkgrel}-$(date -u +%Y%m%d%H%M)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          # Every file in dist/ is an asset, including scripts/vfg-sync.lua;
          # dist/scripts itself must not be passed (gh tries to upload the
          # directory and fails). SHA256SUMS goes last so the list stays sorted.
          mapfile -t assets < <(find dist -type f ! -name SHA256SUMS | sort)
          assets+=("dist/SHA256SUMS")
          # A tag push already created the tag; a manual run needs one.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
              --notes-file dist/RELEASE_NOTES.md "${assets[@]}"
          else
            gh release create "$tag" --title "$tag" \
              --notes-file dist/RELEASE_NOTES.md "${assets[@]}"
          fi
