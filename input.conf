# ==============================================================================
# mpv input.conf - NVIDIA DLSS 5 & VFX AI chain Keybindings (60% Keyboard Layout)
# All shortcuts use standard alphanumeric keys (no Numpad required)
# ==============================================================================

# ------------------------------------------------------------------------------
# Core DLSS 5 NR Lifecycle & Passes
# ------------------------------------------------------------------------------
Ctrl+Alt+n          script-binding nr_toggle/dlssnr-toggle          # Toggle DLSS 5 NR on / off
Ctrl+Alt+1          script-binding nr_toggle/dlssnr-on              # Set 1 pass
Ctrl+Alt+2          script-binding nr_toggle/dlssnr-on-2pass        # Set 2 passes (high quality)
Ctrl+Alt+c          script-binding nr_toggle/dlssnr-passes-cycle    # Cycle passes (1 pass <-> 2 passes)
Ctrl+Alt+0          script-binding nr_toggle/dlssnr-off             # Turn off DLSS 5 NR
Ctrl+Alt+Shift+n    script-binding nr_toggle/dlssnr-off             # Force off & stop helper process

# ------------------------------------------------------------------------------
# Profile & Processing Resolution (Work Scale / Boost)
# ------------------------------------------------------------------------------
Ctrl+Alt+p          script-binding nr_toggle/dlssnr-profile-cycle   # Cycle Profile (Faithful -> Natural -> Cinematic -> Extreme)
Ctrl+Alt+]          script-binding nr_toggle/dlssnr-scale-up        # Work scale up (25% -> 50% -> 65% -> 75% -> 100%)
Ctrl+Alt+[          script-binding nr_toggle/dlssnr-scale-down      # Work scale down
Ctrl+Alt+=          script-binding nr_toggle/dlssnr-scale-up        # Scale up alias
Ctrl+Alt+-          script-binding nr_toggle/dlssnr-scale-down      # Scale down alias

# ------------------------------------------------------------------------------
# Neural Parameter Fine-Tuning (Ctrl+Alt for UP / Ctrl+Alt+Shift for DOWN)
# ------------------------------------------------------------------------------
Ctrl+Alt+i          script-binding nr_toggle/dlssnr-intensity-up        # Intensity +0.05
Ctrl+Alt+Shift+i    script-binding nr_toggle/dlssnr-intensity-down      # Intensity -0.05
Ctrl+Alt+t          script-binding nr_toggle/dlssnr-localtone-up        # Local Tone (Shadows) +0.10
Ctrl+Alt+Shift+t    script-binding nr_toggle/dlssnr-localtone-down      # Local Tone (Shadows) -0.10
Ctrl+Alt+e          script-binding nr_toggle/dlssnr-localstructure-up   # Local Structure (Detail) +0.10
Ctrl+Alt+Shift+e    script-binding nr_toggle/dlssnr-localstructure-down # Local Structure (Detail) -0.10
Ctrl+Alt+s          script-binding nr_toggle/dlssnr-sharpness-up        # Sharpness +0.10
Ctrl+Alt+Shift+s    script-binding nr_toggle/dlssnr-sharpness-down      # Sharpness -0.10
Ctrl+Alt+k          script-binding nr_toggle/dlssnr-skin-cycle          # Cycle Skin Protection (-1.0 off, 0.0..2.0)
Ctrl+Alt+m          script-binding nr_toggle/dlssnr-automask-toggle     # Toggle AutoMask (UI/text protect)

# ------------------------------------------------------------------------------
# Frame Generation (VFG) & Status OSD Dashboard
# ------------------------------------------------------------------------------
Ctrl+Alt+f          script-binding nr_toggle/vfg-toggle             # Toggle Frame Generation (VFG auto / off)
Ctrl+Alt+d          script-binding nr_toggle/dlssnr-status          # Show DLSS 5 HUD Status Dashboard
Ctrl+Alt+h          script-binding nr_toggle/dlssnr-status          # HUD Dashboard alias
