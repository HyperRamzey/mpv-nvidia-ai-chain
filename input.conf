# ==============================================================================
# mpv input.conf - NVIDIA DLSS 5 & VFX AI chain Keybindings
# Modelled after NeuralScreen (https://github.com/perseval-BLR/NeuralScreen)
# ==============================================================================

# ------------------------------------------------------------------------------
# NeuralScreen Numpad Layout (Num Lock ON)
# ------------------------------------------------------------------------------
KP1             script-binding nr_toggle/dlssnr-toggle          # Num1: DLSS 5 NR toggle on / off
KP4             script-binding nr_toggle/dlssnr-scale-down      # Num4: Processing resolution / scale down
KP6             script-binding nr_toggle/dlssnr-scale-up        # Num6: Processing resolution / scale up
KP7             script-binding nr_toggle/vfg-toggle             # Num7: Frame Generation (VFG) toggle
KP_DEC          script-binding nr_toggle/dlssnr-status          # Num.: Show DLSS 5 HUD status banner

# (Fallback bindings when Num Lock is OFF)
KP_END          script-binding nr_toggle/dlssnr-toggle          # End: DLSS 5 NR toggle
KP_LEFT         script-binding nr_toggle/dlssnr-scale-down      # Left: Scale down
KP_RIGHT        script-binding nr_toggle/dlssnr-scale-up        # Right: Scale up
KP_HOME         script-binding nr_toggle/vfg-toggle             # Home: Frame Gen toggle
KP_DEL          script-binding nr_toggle/dlssnr-status          # Del: Status banner

# ------------------------------------------------------------------------------
# Standard Keyboard Shortcuts (Ctrl+Alt+...)
# ------------------------------------------------------------------------------
Ctrl+Alt+n          script-binding nr_toggle/dlssnr-toggle      # Toggle NR on / off
Ctrl+Alt+Shift+n    script-binding nr_toggle/dlssnr-off         # Turn NR off & stop helper
Ctrl+Alt+1          script-binding nr_toggle/dlssnr-on          # Set 1 pass
Ctrl+Alt+2          script-binding nr_toggle/dlssnr-on-2pass    # Set 2 passes (high quality)
Ctrl+Alt+0          script-binding nr_toggle/dlssnr-off         # Turn off

# Profile & Resolution (Boost)
Ctrl+Alt+p          script-binding nr_toggle/dlssnr-profile-cycle # Cycle Profile (Faithful/Natural/Cinematic/Extreme)
Ctrl+Alt+]          script-binding nr_toggle/dlssnr-scale-up      # Work scale up (25% -> 50% -> 65% -> 75% -> 100%)
Ctrl+Alt+[          script-binding nr_toggle/dlssnr-scale-down    # Work scale down

# Fine Tuning Controls
Ctrl+Alt+i          script-binding nr_toggle/dlssnr-intensity-up      # Intensity +0.05
Ctrl+Alt+Shift+i    script-binding nr_toggle/dlssnr-intensity-down    # Intensity -0.05
Ctrl+Alt+t          script-binding nr_toggle/dlssnr-localtone-up      # Local Tone (Shadows) +0.10
Ctrl+Alt+Shift+t    script-binding nr_toggle/dlssnr-localtone-down    # Local Tone (Shadows) -0.10
Ctrl+Alt+e          script-binding nr_toggle/dlssnr-localstructure-up # Local Structure +0.10
Ctrl+Alt+Shift+e    script-binding nr_toggle/dlssnr-localstructure-down # Local Structure -0.10
Ctrl+Alt+s          script-binding nr_toggle/dlssnr-sharpness-up      # Sharpness +0.10
Ctrl+Alt+Shift+s    script-binding nr_toggle/dlssnr-sharpness-down    # Sharpness -0.10
Ctrl+Alt+k          script-binding nr_toggle/dlssnr-skin-cycle        # Skin Protection cycle (Off / 0.0 .. 2.0)
Ctrl+Alt+m          script-binding nr_toggle/dlssnr-automask-toggle   # AutoMask (UI/text protect) toggle

# Frame Generation & Status HUD
Ctrl+Alt+f          script-binding nr_toggle/vfg-toggle         # Toggle Frame Generation (VFG auto / off)
Ctrl+Alt+d          script-binding nr_toggle/dlssnr-status      # Display DLSS 5 HUD Status Dashboard
