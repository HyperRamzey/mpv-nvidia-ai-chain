# ==============================================================================
# NVIDIA VFX AI chain for mpv — OPT-IN, not loaded by default.
#
# Loaded by the `mpv-ai` wrapper:
#     mpv --include=~/.config/mpv/ai.conf --profile=ai <file>
#
# mpv.conf stays the base: vo=gpu-next, gpu-api=vulkan, gpu-context=waylandvk,
# the shader chain, the [HDR] profiles and the audio graph are inherited
# unchanged. This file only appends the CUDA filter chain and the options it
# forces.
#
# Filters compiled into mpv-dovi-vfx-git (not into this file):
#   hwup     upload frames into one shared CUDA context (must come first)
#   vsr      NVIDIA NGX VideoSuperRes
#   truehdr  NVIDIA NGX TrueHDR (SDR -> HDR10; self-guards on PQ/HLG input)
#   dlssnr   DLSS 5 noise reduction (NGX feature 18), in-chain, delta-composited
#   vfg      NVIDIA VideoFrameGeneration (frame interpolation)
#
# CHAIN ORDER IS LOAD-BEARING:  hwup -> [vsr] -> truehdr -> dlssnr -> vfg
# NR must run BEFORE frame generation. A post-present layer cannot do that
# (it would denoise already-interpolated frames), so NR is an in-chain filter.
#
# Resolution policy (2560x1440 panel):
#   h <= 1080         -> VSR at 4/3 (1080p -> 1440p, 720p -> 960p) + HDR + NR + FG
#   1080 < h <= 1440  -> no VSR (already at panel resolution)        + HDR + NR + FG
#   h > 1440          -> no VSR; mpv.conf's dscale=mitchell downscales, then NR + FG
# Everything the AI filters see is at or below panel resolution: dlssnr resizes
# to the panel latch ("size=panel" only ever shrinks) and works on a proxy at
# work_scale of that.
#
# Frame-generation rate policy: fps=auto under a cap of 110, NOT the panel's
# 165 Hz. Two ceilings apply, and the lower one wins:
#   * 165 Hz panel: VFG only does integer multipliers, so a fixed K is wrong
#     for some inputs. 48 fps x4 = 192 oversubscribes the panel outright
#     (measured drop=3490 in 15 s); x3 = 144 is clean (drop=22).
#   * ~96-100 fps chain ceiling: with 2-pass NR at work_scale 0.5 plus VFG, the
#     GPU cannot present 144 fps. Measured over 18 s on 2160p48 content:
#         96 fps output + 2-pass NR   -> drop 4.7/s   (smooth)
#        144 fps output + 2-pass NR   -> drop 59/s    (judders)
#        144 fps output + 1-pass NR   -> drop 5.6/s   (smooth)
#     so 110 keeps auto inside the region that was measured clean. Raise it to
#     164 together with passes=1 if 4x on 48 fps matters more than the second
#     pass. fps=auto then picks the largest K in 2..4 that fits, and passes
#     through cleanly at 120 fps sources (2x120 = 240 fits neither cap).
#
# Dolby Vision policy:
#   P7 (FEL/MEL) and P8 -> dlssnr runs.  NR marks its output no_dovi, so the
#                         enhancement layer is dropped for the frames it
#                         processes: FEL detail is knowingly lost. Use
#                         `dlssnr:dovi=skip` to keep FEL and run without NR.
#   P5 (IPTPQc2)        -> NR is skipped (`dovi=skip`, filter stays inert).
#                         P5's polynomial reshaping is not applied inside the
#                         filter, so a delta computed on the reshaped frame
#                         would be re-shaped on the way out. FG and HDR still
#                         run; only NR is off.
#   2160p DV            -> h > 1440, so no VSR, and truehdr self-guards on PQ
#                         (truehdr-status: mode=passthrough). Only NR + FG run.
#
# profile-restore=copy-equal on every profile below, NOT copy:
#   profile-cond properties do not all become available at the same moment. The
#   Dolby Vision profile number comes from the track list
#   (current-tracks/video/dolby-vision-profile -- note that video-params has NO
#   dolby-vision-profile field in this build; that map is per-track, and using
#   the wrong path fails silently as nil), while h is known slightly earlier.
#   So the non-DV profile can apply first and deactivate a moment later. With
#   restore=copy that deactivation restores the saved (empty) vf and wipes the
#   chain of the profile that just took over -- the historical "no filters at
#   all" bug. copy-equal only restores an option if it still holds the value
#   the profile set, so a profile that has already been superseded restores
#   nothing. Do not change this back to copy.
#
# The helper must be running for dlssnr:
#     ~/.local/bin/dlssnr-helper start|status|stop
#   log: ~/.local/state/dlssnr/helper.log     a reboot stops it
#
# Known defect (cosmetic, pre-existing, VFG-specific):
#   On quit, a Dolby Vision file played through hwup+vfg can abort in
#   vo_gpu_next.c:2507 -- "uninit: Assertion p->num_dr_buffers == 0". The frame
#   that VFG synthesised holds a DR buffer the VO no longer tracks by the time
#   uninit runs. Playback and all output before the quit are unaffected; it only
#   turns a clean exit into a core dump. It predates dlssnr and is not caused by
#   this file. Do not "fix" it by removing vfg.
# ==============================================================================

[ai]
profile-desc=NVIDIA VFX: NVDEC decode + CUDA filter chain
# REQUIRED. With hwdec=vulkan (meta) the frames are Vulkan images and hwup
# cannot upload them to CUDA: "[hwup] sws_scale failed", and the whole chain
# disables itself. nvdec yields cuda[] frames, which is what the chain needs.
hwdec=nvdec

# ==============================================================================
# h <= 1080: neural upscale to 4/3, then HDR, then NR, then frame generation
# ==============================================================================
[ai-vsr]
profile-desc=<=1080p: VSR 4/3 + TrueHDR + DLSS5 NR + VFG auto
profile-cond=(p["video-params/h"] or 0) > 0 and (p["video-params/h"] or 0) <= 1080 and (p["current-tracks/video/dolby-vision-profile"] or 0) ~= 5
profile-restore=copy-equal
vf=hwup,vsr:scale=4/3,truehdr:enable=yes:luminance=630,dlssnr:passes=2:profile=cinematic:work_scale=0.5:size=panel,vfg:fps=auto:max-fps=110

[ai-vsr-p5]
profile-desc=<=1080p, Dolby Vision P5: VSR 4/3 + TrueHDR + VFG auto, NR skipped
profile-cond=(p["video-params/h"] or 0) > 0 and (p["video-params/h"] or 0) <= 1080 and (p["current-tracks/video/dolby-vision-profile"] or 0) == 5
profile-restore=copy-equal
vf=hwup,vsr:scale=4/3,truehdr:enable=yes:luminance=630,dlssnr:passes=2:dovi=skip,vfg:fps=auto:max-fps=110

# ==============================================================================
# 1080 < h <= 1440: already at panel resolution, no upscale
# ==============================================================================
[ai-mid]
profile-desc=1080-1440p: TrueHDR + DLSS5 NR + VFG auto, no VSR
profile-cond=(p["video-params/h"] or 0) > 1080 and (p["video-params/h"] or 0) <= 1440 and (p["current-tracks/video/dolby-vision-profile"] or 0) ~= 5
profile-restore=copy-equal
vf=hwup,truehdr:enable=yes:luminance=630,dlssnr:passes=2:profile=cinematic:work_scale=0.5:size=panel,vfg:fps=auto:max-fps=110

[ai-mid-p5]
profile-desc=1080-1440p, Dolby Vision P5: TrueHDR + VFG auto, NR skipped
profile-cond=(p["video-params/h"] or 0) > 1080 and (p["video-params/h"] or 0) <= 1440 and (p["current-tracks/video/dolby-vision-profile"] or 0) == 5
profile-restore=copy-equal
vf=hwup,truehdr:enable=yes:luminance=630,dlssnr:passes=2:dovi=skip,vfg:fps=auto:max-fps=110

# ==============================================================================
# h > 1440: mpv.conf downscales to the render target first (dscale=mitchell),
# then the AI chain works at panel size. This is the 2160p / DV 2160p band.
# ==============================================================================
[ai-big]
profile-desc=>1440p: downscale to panel, TrueHDR (passthrough on PQ) + DLSS5 NR + VFG auto
profile-cond=(p["video-params/h"] or 0) > 1440 and (p["current-tracks/video/dolby-vision-profile"] or 0) ~= 5
profile-restore=copy-equal
vf=hwup,truehdr:enable=yes:luminance=630,dlssnr:passes=2:profile=cinematic:work_scale=0.5:size=panel,vfg:fps=auto:max-fps=110

[ai-big-p5]
profile-desc=>1440p, Dolby Vision P5: downscale + VFG auto, NR skipped
profile-cond=(p["video-params/h"] or 0) > 1440 and (p["current-tracks/video/dolby-vision-profile"] or 0) == 5
profile-restore=copy-equal
vf=hwup,truehdr:enable=yes:luminance=630,dlssnr:passes=2:dovi=skip,vfg:fps=auto:max-fps=110

# ==============================================================================
# Tuning notes (measured, DLSS5-NR-PLAN.md has the numbers and the method)
#
#   profile=cinematic  (default) NeuralScreen's cinematic preset: style 2,
#                      automask 1, intensity 1.0, local tone 0.90, structure
#                      1.50. Strongest real detail on textured areas; lifts
#                      shadows locally, so near-flat dark areas can blotch.
#   profile=faithful   gentlest measured option (2.5 codes mean delta against
#                      a no-NR reference on identical frames, vs 5.5 for
#                      cinematic at the same work_scale).
#   profile=natural    between the two; the most neutral per-frame chroma fit.
#   work_scale=1.0     noticeably better than 0.5 (no resampled residual at
#                      all) and roughly half the throughput: 22 fps vs 43 fps
#                      on 2160p48 input. 0.5 is the default because 48 fps
#                      playback needs the headroom.
#   blackgate=8        the model returns a ~4-level pedestal wherever its input
#                      was black, fading to zero by level 24. 8 fades the
#                      residual out under the knee; 0 reproduces NeuralScreen
#                      byte for byte and costs 0.44 nits on every black bar.
#   passes=2           the second pass is near-identity (0.1% of bytes differ),
#                      so it buys stability rather than a second look; it also
#                      enables sdr16Multipass, the documented mitigation for
#                      8-bit ping-pong hue error. passes=0 disables NR (that is
#                      the no-NR reference used for every measurement above).
#
# Measured playback, 18 s each, drop = frame-drop-count at the end
# (framedrops are what the eye sees; filter fps is not):
#
#   source                     chain                        drop
#   2160p48 DV P7              hwup+vfg k=2                 84
#   2160p48 DV P7              hwup+dlssnr(2)+vfg k=2       84    <- shipped
#   2160p48 DV P7              hwup+dlssnr(2)+vfg k=3       1055  (too fast)
#   2160p48 DV P7              hwup+dlssnr(1)+vfg k=3       100
#   2160p48 DV P7              hwup+dlssnr(2,ws.25)+vfg k=3 210
#   2160p24 DV (3754x1854)     ai-big, k=4                  3     <- comfortable
#   1080p48 SDR                ai-vsr (vsr+2NR+vfg k=2)     342   <- stress case
#   2160p48 HDR10              ai-big, truehdr=passthrough  13
#
#   Reading: 2-pass NR at work_scale 0.5 plus VFG tops out near 96-100 fps
#   presented, so max-fps=110 (not 164) is what keeps the shipped combos clean.
#   1080p content is the stress case because VSR adds a full NGX upscale on top
#   of NR; a 48 fps 1080p source is the worst input, and it still presents ~95/s
#   with a visible but bounded drop count. Use passes=1 there if it bothers you.
#   24 fps sources are comfortably inside the budget (drop=3 over 20 s).
#
# Live tuning without restarting playback:
#   vf-command dlssnr passes 1          (also: profile, detail, guard, blackgate)
#   vf-command vfg fps 4                (also: max-fps, mode)
#   `dlssnr-status:` and `vfg-status:` print once a second in the terminal.
# ==============================================================================
